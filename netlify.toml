# Netlify deployment config for the SL Strength OS (Next.js 14 App Router).
# Runs in sample mode when NOTION_API_KEY is unset — ideal for demos/promo,
# showing bundled sample data (no real client information).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime — handles the App Router, server components,
# and the force-dynamic routes.
[[plugins]]
  package = "@netlify/plugin-nextjs"
